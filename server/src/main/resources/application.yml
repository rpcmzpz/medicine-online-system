server:
  port: 3000

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/medicine_online?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: medicine_online_jwt_secret_key_2024
  expiration: 7200
  refresh-expiration: 604800

upload:
  path: ./uploads
